<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helpdesk — Support Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-left">
      <span class="mark">◈</span>
      <h1>Support Console</h1>
    </div>
    <div class="stats" id="stats">
      <span class="stat"><strong id="stat-total">–</strong><em>total</em></span>
      <span class="stat stat-open"><strong id="stat-open">–</strong><em>open</em></span>
      <span class="stat stat-in_progress"><strong id="stat-in_progress">–</strong><em>in progress</em></span>
      <span class="stat stat-resolved"><strong id="stat-resolved">–</strong><em>resolved</em></span>
    </div>
  </header>

  <main class="layout">

    <!-- LEFT: ticket queue -->
    <section class="queue">
      <div class="queue-header">
        <div class="filters" id="filters">
          <button class="filter-btn active" data-status="">All</button>
          <button class="filter-btn" data-status="open">Open</button>
          <button class="filter-btn" data-status="in_progress">In progress</button>
          <button class="filter-btn" data-status="resolved">Resolved</button>
        </div>
        <button class="btn-new" id="btn-new-ticket">+ New ticket</button>
      </div>

      <div class="ticket-list" id="ticket-list">
        <p class="empty-hint">Loading tickets…</p>
      </div>
    </section>

    <!-- RIGHT: ticket detail -->
    <section class="detail" id="detail">
      <div class="empty-state">
        <p>Select a ticket to view its conversation.</p>
      </div>
    </section>

  </main>
</div>

<!-- New ticket modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2>New ticket</h2>
    <form id="new-ticket-form">
      <label>Title
        <input type="text" name="title" placeholder="e.g. Billing charge looks wrong" required>
      </label>
      <label>Your name
        <input type="text" name="created_by" placeholder="e.g. jordan" required>
      </label>
      <div class="form-row">
        <label>Priority
          <select name="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label>Category
          <input type="text" name="category" placeholder="e.g. billing">
        </label>
      </div>
      <p class="form-error" id="form-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="btn-cancel">Cancel</button>
        <button type="submit" class="btn-primary">Create ticket</button>
      </div>
    </form>
  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
